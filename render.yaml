services:
  - type: web
    name: domyapp-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: domyapp-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"
    plan: free

databases:
  - name: domyapp-db
    plan: free
