name: CI / Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test --verbosity=2
        env:
          SECRET_KEY: ci-only-not-for-production
          DEBUG: "True"
          # Sin DATABASE_URL → Django usa SQLite en CI

  deploy:
    needs: test-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render response: $response"
          [ "$response" = "200" ] || [ "$response" = "201" ] || exit 1
