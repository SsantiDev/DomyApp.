[phases.setup]
nixPkgs = [
    "python311",
    "gcc",
    "postgresql",
    "libpq",
    "libjpeg",
    "zlib",
    "libwebp",
    "libpng",
    "freetype",
    "openssl"
]

[phases.install]
cmds = [
    "python3 -m venv /app/.venv",
    "/app/.venv/bin/pip install --upgrade pip",
    "/app/.venv/bin/pip install -r Backend/requirements.txt"
]

[phases.build]
cmds = [
    "cd Backend && /app/.venv/bin/python manage.py collectstatic --noinput"
]

[start]
cmd = "cd Backend && /app/.venv/bin/python manage.py migrate --noinput && /app/.venv/bin/gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
