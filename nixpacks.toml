[phases.setup]
nixPkgs = ["python311", "gcc", "postgresql"]

[phases.install]
cmds = [
    "python3 -m venv /app/.venv",
    "/app/.venv/bin/pip install --upgrade pip",
    "/app/.venv/bin/pip install -r Backend/requirements.txt"
]

[phases.build]
cmds = [
    "cd Backend && /app/.venv/bin/python manage.py collectstatic --noinput",
    "cd Backend && /app/.venv/bin/python manage.py migrate --noinput"
]

[start]
cmd = "cd Backend && /app/.venv/bin/gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
