[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools", "python311Packages.wheel", "gcc", "postgresql"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -r Backend/requirements.txt"]

[phases.build]
cmds = [
    "cd Backend && python3 manage.py collectstatic --noinput",
    "cd Backend && python3 manage.py migrate --noinput"
]

[start]
cmd = "cd Backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
