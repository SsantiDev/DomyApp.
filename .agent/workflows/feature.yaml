name: 'Dynamic Feature Workflow'
description: 'Gestión profesional de commits atómicos, ramas por tipo y validación continua para el ecosistema Domy'
workflow:
  - run: 'git diff --cached'
    register: changes

  - call: 'antigravity/llm'
    args:
      prompt: 'Analiza este diff staged: {{changes}}. Clasifica el cambio en una de estas categorías: feat, fix, docs, refactor, chore, style, test. Responde solo con la palabra de la categoría.'
    register: change_type

  - input: 'Nombre corto del bloque atómico (ej: fix-login-null, feat-user-profile):'
    register: feature_name

  - run: 'git checkout -b {{change_type}}/{{feature_name}}'

  - call: 'antigravity/llm'
    args:
      prompt: 'Genera un mensaje de commit convencional para este diff staged: {{changes}}. Debe comenzar estrictamente con "{{change_type}}: ". Usa el infinitivo en inglés. Solo devuelve el mensaje, sin comillas.'
    register: message

  - run: 'git commit -m "{{message}}"'

  - name: 'Validación de Backend'
    if: 'change_type in ["feat", "fix", "refactor", "test"]'
    run: 'cd Backend; ./.venv/bin/python manage.py test'

  - name: 'Validación de Frontend'
    if: 'change_type in ["feat", "fix", "refactor", "test"]'
    run: 'cd Fronted; npm test -- --watchAll=false'

  - run: 'git push origin {{change_type}}/{{feature_name}}'
  - run: 'git checkout develop'
  - run: 'git merge {{change_type}}/{{feature_name}}'
  - run: 'git push origin develop'
  - run: 'git branch -D {{change_type}}/{{feature_name}}'
  - call: 'antigravity/message'
    args:
      content: '✓ Bloque atómico integrado con éxito en develop.'

on_error:
  - call: 'antigravity/message'
    args:
      content: '⚠ Proceso interrumpido. Los tests fallaron o hubo un conflicto. Revisa la rama {{change_type}}/{{feature_name}}.'
