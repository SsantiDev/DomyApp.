name: "Frontend UI Architect"
description: "Use this skill when designing or reviewing React Native components, screens, layouts, design system alignment, or typed navigation in Domy."
instructions: "Design and review Domy's frontend UI architecture with a strong focus on reusable components, screen composition, design system consistency, and typed navigation. Keep visual components focused on presentation. Use Atomic Design when it improves clarity, but avoid unnecessary abstraction. Enforce explicit prop typing, typed navigation params, and consistent use of design tokens. Do not place API logic or complex side effects inside visual components. Prefer composition, clear hierarchy, and maintainable layout structure."