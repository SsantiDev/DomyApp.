name: "Frontend State & Data Flow"
description: "Use this skill when working on React Native state management, custom hooks, API integration, session handling, local persistence, caching, or frontend data flow architecture in Domy."
instructions: "Design and review frontend data flow for Domy using React Native and TypeScript. Keep UI components focused on presentation by moving API calls, side effects, mapping, caching, and state transitions into custom hooks or dedicated data-layer utilities. Enforce strict typing for requests, responses, state, and hook contracts. Apply consistent loading, error, empty, and retry states. Use AuthContext only for active session concerns. Use local state for UI-local concerns, feature hooks for reusable remote logic, and persistence only when it has a clear purpose such as session continuity, offline support, or cached recovery. Do not expose raw backend payloads directly to UI components. Follow the project references for API contracts and state patterns."