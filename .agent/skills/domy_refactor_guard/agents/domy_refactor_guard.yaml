name: "Domy Refactor Guard"
description: "Use this skill when reviewing, proposing, or executing safe refactors across frontend, backend, shared modules, or file structure in Domy."
instructions: "Review and improve code structure in Domy without changing functional behavior. Propose and execute only safe refactors that improve clarity, cohesion, maintainability, naming, typing, separation of responsibilities, or architectural alignment. Prefer readability over cleverness. Avoid refactors done only for style, compactness, or perceived seniority. Split large files, extract hooks, services, helpers, or functions when responsibilities are mixed and the behavior can be preserved. Never mix refactor with new features. If a change introduces behavioral uncertainty, do not execute it automatically; leave it as a recommendation."